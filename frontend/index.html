<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarchy Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="container">
        <header>
            <h1>Hierarchy Architect</h1>
            <p>Define graph edges to visualize your trees and automatically resolve cycles.</p>
        </header>

        <main>
            <form id="graph-form" class="glass-panel">
                <div class="input-group">
                    <label for="edges-input">Enter Edges (comma separated array or JSON):</label>
                    <textarea id="edges-input" placeholder='e.g. ["A->B", "A->C", "B->D"] or A->B, A->C' rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">
                    <span>Process Graph</span>
                    <div class="spinner loader-hidden" id="loader"></div>
                </button>
                <div id="error-message" class="error-msg"></div>
            </form>

            <div id="results" class="results-container hidden">
                <div class="dashboard">
                    <div class="summary-card glass-panel badge-box">
                        <h3>Trees</h3>
                        <div class="badge-value" id="val-trees">-</div>
                    </div>
                    <div class="summary-card glass-panel badge-box">
                        <h3>Cycles</h3>
                        <div class="badge-value" id="val-cycles">-</div>
                    </div>
                    <div class="summary-card glass-panel badge-box">
                        <h3>Top Root</h3>
                        <div class="badge-value" id="val-root">-</div>
                    </div>
                </div>
                
                <div class="panels-grid">
                    <div class="glass-panel section-panel main-trees">
                        <h2>Computed Hierarchies</h2>
                        <div id="trees-container" class="trees-container"></div>
                    </div>
                    <div class="side-panels">
                        <div class="glass-panel section-panel">
                            <h2>Invalid Entries</h2>
                            <ul id="invalid-list" class="tag-list"></ul>
                        </div>
                        <div class="glass-panel section-panel">
                            <h2>Duplicate Edges</h2>
                            <ul id="duplicate-list" class="tag-list"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
